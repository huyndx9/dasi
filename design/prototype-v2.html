<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Dasi Prototype v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+Khmer:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
/* Layout: app shell — top bar + left rail on desktop, bottom tab bar on phones; live class is a two-pane reading surface */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --sunk:#EAEFF7; --line:#DCE3EE;
  --fg:#16223B; --muted:#5B6884; --faint:#8A95AD;
  --primary:#1B2A4A; --on-primary:#FFFFFF;
  --live:#E8573A; --live-soft:#FDE9E3;
  --learn:#0F9471; --learn-soft:#DDF3EC;
  --warn:#B86E00; --warn-soft:#FFF1D6;
  --hl:#FFE8A3; --hl-fg:#5A4100;
  --l-vi:#D9443A; --l-zh:#C98A0B; --l-en:#2F6FD6; --l-uz:#169C8C; --l-ne:#8A4FD0; --l-mn:#C2417F; --l-th:#3B8F3E; --l-ru:#5A6C8F;
  --ff-ui:"Be Vietnam Pro", "Noto Sans KR", "Noto Sans Devanagari","Noto Sans Thai","Noto Sans Khmer","Noto Sans Myanmar", system-ui, sans-serif;
  --ff-ko:"Noto Sans KR","Be Vietnam Pro", system-ui, sans-serif;
  --ff-mono:"IBM Plex Mono", ui-monospace, monospace;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(22,34,59,.06), 0 6px 20px rgba(22,34,59,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#151D2E; --sunk:#1C2639; --line:#2A3550;
  --fg:#E7ECF5; --muted:#A1ACC3; --faint:#717D98;
  --primary:#E7ECF5; --on-primary:#111A2B;
  --live:#FF7759; --live-soft:#3A1F1B; --learn:#3CC79E; --learn-soft:#12352C; --warn:#F0B44C; --warn-soft:#3A2D12;
  --hl:#5B4A12; --hl-fg:#FFE7A0;
  --l-vi:#FF7A70; --l-zh:#F1B841; --l-en:#6FA3FF; --l-uz:#45CDBB; --l-ne:#B98AF5; --l-mn:#F07AB5; --l-th:#71C46F; --l-ru:#9AABCC;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#151D2E; --sunk:#1C2639; --line:#2A3550;
  --fg:#E7ECF5; --muted:#A1ACC3; --faint:#717D98;
  --primary:#E7ECF5; --on-primary:#111A2B;
  --live:#FF7759; --live-soft:#3A1F1B; --learn:#3CC79E; --learn-soft:#12352C; --warn:#F0B44C; --warn-soft:#3A2D12;
  --hl:#5B4A12; --hl-fg:#FFE7A0;
  --l-vi:#FF7A70; --l-zh:#F1B841; --l-en:#6FA3FF; --l-uz:#45CDBB; --l-ne:#B98AF5; --l-mn:#F07AB5; --l-th:#71C46F; --l-ru:#9AABCC;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--ff-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--l-en);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700} h2{font-size:17px;font-weight:700} h3{font-size:14px;font-weight:600}
p{margin:0}
.ko{font-family:var(--ff-ko)}
.mono{font-family:var(--ff-mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{opacity:.9}
.btn.live{background:var(--live);color:#fff;border-color:transparent}
.btn.learn{background:var(--learn);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.lg{height:44px;padding:0 20px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:16px;height:16px;flex:none}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--sunk);font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:600 10.5px/1 var(--ff-mono);letter-spacing:.04em}
.tag.mic{background:var(--sunk);color:var(--muted)}
.tag.tab{background:var(--learn-soft);color:var(--learn)}
.tag.beta{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--learn-soft);color:var(--learn)}
.tag.plan{background:var(--sunk);color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 16px var(--ff-ko)}
.search{flex:1;max-width:440px;height:36px;border-radius:999px;background:var(--sunk);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--faint);min-width:0}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.top .spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);position:relative;flex:none}
.iconbtn:hover{background:var(--sunk)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--live);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:9px;color:var(--muted);font-weight:500;width:100%;text-align:left}
.nav:hover{background:var(--sunk);color:var(--fg)}
.nav.on{background:var(--sunk);color:var(--fg);font-weight:600}
.nav.on .icon{color:var(--live)}
.side .meter{margin-top:auto;padding:12px;border-radius:10px;background:var(--sunk);font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.main{overflow:auto;min-width:0}
.page{padding-block:24px 96px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.page>header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.bottomnav{display:none}
.demo-switch{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.demo-switch button{white-space:nowrap;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.demo-switch button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) auto}
  .side{display:none}
  .search{display:none}
  .bottomnav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-inline:max(4px,env(safe-area-inset-left,0px)) max(4px,env(safe-area-inset-right,0px))}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--faint);font-weight:500;min-width:0}
  .bottomnav button.on{color:var(--fg);font-weight:600}
  .bottomnav button.on .icon{color:var(--live)}
  .top [data-a=offline]{display:none}
  .demo-switch button{padding:0 8px}
}

/* language legend */
.lang{display:inline-flex;align-items:center;gap:6px}
.langbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.langbar>i{display:block;height:100%}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.login-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;max-width:1020px;width:100%}
.hero{padding:36px;display:flex;flex-direction:column;gap:22px}
.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.12;font-weight:800}
.demo-line{border-radius:var(--r);background:var(--sunk);padding:16px;display:flex;flex-direction:column;gap:8px}
.demo-line .ko{font-size:19px;font-weight:500}
.tr{display:flex;gap:10px;align-items:baseline;font-size:14px}
.tr .code{font:600 11px var(--ff-mono);width:24px;flex:none}
.steps{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint)}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:11px;color:var(--muted)}
.steps .on b{background:var(--primary);color:var(--on-primary)}
.steps .on{color:var(--fg);font-weight:600}
.role{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);border:1px solid var(--line);text-align:left;width:100%;background:var(--surface)}
.role:hover{border-color:var(--primary)}
.role .ic{width:42px;height:42px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}
.role[disabled]{opacity:.5;cursor:not-allowed}
.gbtn{height:48px;width:100%;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;background:var(--surface)}
.gbtn:hover{background:var(--sunk)}
.langgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
@media (max-width:860px){.login-wrap{grid-template-columns:1fr}.hero{padding:22px}}

/* class cards */
.classgrid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.classcard{padding:18px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;transition:border-color .15s}
.classcard:hover{border-color:var(--faint)}
.classcard.sel{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.ccode{font:500 12px var(--ff-mono);background:var(--sunk);padding:3px 8px;border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:40px;padding:0 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--live)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,30,.5);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.modal>header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.modal>.body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.modal>footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:flex;gap:6px}
.stepper div{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--faint);font-weight:500}
.stepper div::before{content:"";height:3px;border-radius:9px;background:var(--line)}
.stepper div.done::before,.stepper div.on::before{background:var(--primary)}
.stepper div.on{color:var(--fg);font-weight:600}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.input,select.input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);border:1px solid var(--line);text-align:left;width:100%;background:var(--surface)}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--primary)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;height:34px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--sunk)}
.check .st{margin-left:auto;font-size:12px;font-weight:600}
.meterbars{display:flex;align-items:flex-end;gap:3px;height:22px}
.meterbars i{width:4px;border-radius:2px;background:var(--learn);height:30%;transition:height .12s}
.callout{padding:12px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--sunk);color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.switch:last-child{border-bottom:0}
.tg{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--learn)} .tg.on::after{left:19px}

/* live */
.livewrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%}
.livebar{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.rec{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--live-soft);color:var(--live);font:600 12px var(--ff-mono)}
.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:blink 1.2s infinite}
.rec.paused{background:var(--sunk);color:var(--muted)} .rec.paused::before{background:var(--faint);animation:none}
@keyframes blink{50%{opacity:.25}}
.feed{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.seg-card{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative}
.seg-card .src{font-size:18px;line-height:1.55;font-weight:500}
.seg-card.partial .src{color:var(--muted);font-style:italic}
.seg-card.partial .src::after{content:"";display:inline-block;width:2px;height:1em;background:var(--live);margin-left:2px;vertical-align:-2px;animation:blink 1s infinite}
.seg-card .acts{position:absolute;top:10px;right:10px;display:none;gap:4px}
.seg-card:hover .acts,.seg-card:focus-within .acts{display:flex}
mark.g{background:var(--hl);color:var(--hl-fg);border-radius:4px;padding:0 3px}
.w{cursor:pointer;border-bottom:1px dashed transparent}
.w:hover{border-color:var(--faint)}
.trline{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--fg)}
.trline .code{font:600 10.5px var(--ff-mono);width:22px;flex:none}
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.panel .tabs{padding:0 12px}
.panel .pbody{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.q{padding:12px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.q.new{border-color:var(--live)}
.q.done{opacity:.55}
.confused{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600}
.projector{position:fixed;inset:0;background:#0B111D;color:#F3F6FB;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:max(32px,env(safe-area-inset-top,0px)) max(32px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px))}
.projector .big{font:500 clamp(28px,4.4vw,56px)/1.35 var(--ff-ko)}
.projector .sub{font-size:clamp(16px,2vw,26px);color:#B9C3D8;display:flex;gap:14px;align-items:baseline}
.projector .sub .code{font:600 14px var(--ff-mono);color:#8090AE;width:30px}
.projector mark.g{background:#5B4A12;color:#FFE7A0}
@media (max-width:1100px){.livewrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 300px}.panel{border-left:0;border-top:1px solid var(--line)}}

/* lesson detail */
.player{padding:16px;display:flex;flex-direction:column;gap:12px}
.timeline{position:relative;height:36px;border-radius:8px;background:var(--sunk);overflow:hidden;cursor:pointer}
.timeline .prog{position:absolute;inset:0 auto 0 0;background:var(--line)}
.timeline .slide{position:absolute;top:6px;width:18px;height:24px;border-radius:3px;background:var(--surface);border:1px solid var(--faint)}
.timeline .head{position:absolute;top:0;bottom:0;width:2px;background:var(--live)}
.tline{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:10px 8px;border-radius:8px;text-align:left;width:100%}
.tline:hover{background:var(--sunk)}
.tline.on{background:var(--live-soft)}
.vocab td:first-child{font:500 15px var(--ff-ko)}

/* student */
.s-page{max-width:560px}
.livecard{background:var(--primary);color:var(--on-primary);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.livecard .rec{background:rgba(232,87,58,.18)}
.tile{padding:16px;display:flex;flex-direction:column;gap:8px}
.big-num{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub-big{font:500 clamp(22px,6vw,28px)/1.5 var(--ff-ko)}
.sub-tr{font-size:clamp(16px,4.4vw,19px);line-height:1.5}
.hold{width:100%;height:64px;border-radius:999px;background:var(--live);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;user-select:none;touch-action:none}
.hold.rec-on{background:var(--primary);color:var(--on-primary)}
.pop{position:fixed;z-index:70;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.flash{perspective:1000px;height:220px}
.flash .inner{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.flash .back{transform:rotateY(180deg)}

/* charts */
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:13px}
.hbar .track{height:12px;background:var(--sunk);border-radius:4px;position:relative}
.hbar .track i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.axis{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;font:500 10.5px var(--ff-mono);color:var(--faint)}
.axis div{display:flex;justify-content:space-between}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 16px));z-index:80;background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (max-width:860px){.toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.offline{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;margin-bottom:16px}
.processing{display:grid;place-items:center;height:100%;padding:24px}
.pstep{display:flex;gap:12px;align-items:center;font-size:14px}
.pstep .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px}
.pstep.done .ic{background:var(--learn);color:#fff}
.pstep.run .ic{border:2px solid var(--live);border-top-color:transparent;animation:spin .8s linear infinite;background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- live class (teacher) ---------- */
function startLive(){
  S.modal=null; S.screen='live';
  S.live={shown:2,partial:'',paused:false,filter:'all',tab:'questions',confused:3,elapsed:12*60+45,proj:false,qSeen:S.questions.length};
  render();
}
function segHTML(s,filter,partial){
  const langs=filter==='all'?['vi','zh','en']:[filter];
  return `<article class="seg-card ${partial?'partial':''}">
    <div class="row" style="gap:6px;font-size:12px"><b>${s.who}</b>${s.lang?`<span class="dot" style="background:${lc(s.lang)}"></span>`:''}<span class="mono faint">${s.t}</span><span class="tag ${s.src}">${s.src.toUpperCase()}</span></div>
    <div class="src ko" ${partial?'id="partial"':''}>${partial?esc(koPlain(s.ko)).slice(0,0):koHTML(s.ko)}</div>
    ${partial?'':langs.map(l=>`<div class="trline"><span class="code" style="color:${lc(l)}">${l.toUpperCase()}</span><span>${esc(s[l])}</span></div>`).join('')}
    ${s.g&&!partial?`<div><span class="chip ko" style="background:var(--hl);color:var(--hl-fg)">${s.g}</span></div>`:''}
    ${partial?'':`<div class="acts"><button class="btn sm" data-a="toast" data-v="Đã ghim làm ví dụ của bài">${ic('pin')} Ghim</button><button class="btn sm" data-a="toast" data-v="Đã thêm vào từ vựng bài 7">${ic('star')} Lưu từ</button></div>`}
  </article>`;
}
function liveView(){
  const L=S.live, c=cls(), mm=String(Math.floor(L.elapsed/60)).padStart(2,'0'), ss=String(L.elapsed%60).padStart(2,'0');
  const open=S.questions.filter(q=>q.st==='open').length;
  return `<div class="livewrap">
    <div class="livebar">
      <button class="iconbtn" data-a="confirmStop" aria-label="Kết thúc và quay lại">${ic('back')}</button>
      <span class="rec ${L.paused?'paused':''}" id="clock">${L.paused?'TẠM DỪNG':'REC'} ${mm}:${ss}</span>
      <div style="min-width:0"><b>${c.name} · Bài 7</b><div class="faint" style="font-size:12px">Micro + Zoom · ${Object.keys(c.langs).map(l=>l.toUpperCase()).join(' · ')} · 21/23 học sinh đang xem</div></div>
      <div class="spacer" style="flex:1"></div>
      <div class="seg" style="flex:none">${['all','vi','zh','en'].map(f=>`<button class="${L.filter===f?'on':''}" data-a="filter" data-v="${f}" style="flex:none">${f==='all'?'Tất cả':f.toUpperCase()}</button>`).join('')}</div>

      <button class="btn" data-a="invite">${ic('qr')} Mời học sinh</button>

      <button class="btn live" data-a="confirmStop">${ic('stop')} Kết thúc</button>
    </div>
    <div class="feed" id="feed">${S.offline?offlineBar():''}
      ${SEGS.slice(0,L.shown).map(s=>segHTML(s,L.filter)).join('')}

function livePanel(){
  const L=S.live;
  if(L.tab==='questions') return `
    ${L.confused?`<div class="confused">${ic('help')} ${L.confused} học sinh bấm “Chưa hiểu” trong 2 phút qua <button class="btn sm" style="margin-left:auto" data-a="clearConfused">Đã giải thích</button></div>`:''}

    </div>`).join('')}

  if(L.tab==='assist') return `
    <div class="row">${['Từ vựng mới?','Ngữ pháp vừa dạy?','Tóm tắt tới giờ','Gợi ý câu hỏi kiểm tra'].map(t=>`<button class="chip" style="height:30px" data-a="assist" data-v="${t}">${t}</button>`).join('')}</div>
    <div class="q" id="assist-out"><span class="eyebrow">Trợ lý</span><span>Chọn một gợi ý ở trên hoặc hỏi về buổi học. Câu trả lời dựa trên bản ghi tới thời điểm hiện tại.</span></div>
    <label class="search" style="max-width:none;display:flex"><input id="assist-in" placeholder="Hỏi về buổi học này…"></label>`;
  return `<div class="tablewrap"><table class="vocab"><tbody>${Object.entries(DICT).slice(0,Math.max(2,L.shown-1)).map(([k,d])=>`<tr><td>${k}</td><td>${d.vi}</td><td class="muted">${d.zh}</td></tr>`).join('')}</tbody></table></div>
    <p class="faint" style="font-size:12px">Tự thêm khi từ xuất hiện trong bài. Bạn duyệt lại sau buổi học.</p>`;
}
function projector(){
  const s=SEGS[Math.max(0,S.live.shown-1)];
  return `<div class="projector" role="dialog" aria-label="Chế độ chiếu">
    <div class="between" style="position:absolute;top:max(20px,env(safe-area-inset-top,0px));left:max(32px,env(safe-area-inset-left,0px));right:max(32px,env(safe-area-inset-right,0px))"><span class="rec">REC</span><button class="btn" style="background:#1E2638;color:#F3F6FB;border-color:#2E3A55" data-a="proj">${ic('x')} Thoát chế độ chiếu</button></div>
    <div class="big" id="proj-big">${koHTML(s.ko)}</div>
    ${['vi','zh','en'].map(l=>`<div class="sub"><span class="code">${l.toUpperCase()}</span><span>${esc(s[l])}</span></div>`).join('')}
  </div>`;
}
function tickLive(){
  const L=S.live; if(!L||L.paused) return;
  L.elapsed++;
  const clock=document.getElementById('clock'); if(clock) clock.textContent=`REC ${String(Math.floor(L.elapsed/60)).padStart(2,'0')}:${String(L.elapsed%60).padStart(2,'0')}`;
}
function typePartial(){
  const L=S.live; if(!L||L.paused||L.shown>=SEGS.length) return;
  const full=koPlain(SEGS[L.shown].ko), el=document.getElementById('partial');
  L.partial=(L.partial||'');
  if(L.partial.length<full.length){ L.partial=full.slice(0,L.partial.length+2); if(el) el.textContent=L.partial; }
  else { L.shown++; L.partial=''; if(!document.querySelector('.pop')) renderKeepScroll(true); }
}

      <div class="face"><span class="ko" style="font-size:40px;font-weight:700">${k}</span><span class="faint">Chạm để xem nghĩa</span></div>
      <div class="face back"><span style="font-size:24px;font-weight:700">${d[S.slang]||d.en}</span><span class="ko muted">${d.ex}</span></div></div></button>
    <div class="row" style="flex-wrap:nowrap"><button class="btn lg" style="flex:1" data-a="nextCard">Chưa nhớ</button><button class="btn learn lg" style="flex:1" data-a="nextCard">Đã nhớ</button></div></div>`;
}
function sProgress(){
  const wk=[['T1',18],['T2',26],['T3',31],['T4',42]];
  return `<div class="page s-page stack" style="gap:14px"><h1>Tiến độ</h1>
    <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">${[['Từ đã thuộc','117'],['Giờ nghe','14,5'],['Điểm TB','8,2']].map(([l,v])=>`<div class="card tile"><span class="eyebrow">${l}</span><span class="big-num" style="font-size:24px">${v}</span></div>`).join('')}</div>
    <section class="card pad stack"><h3>Từ thuộc mỗi tuần</h3>${wk.map(([w,n])=>`<div class="hbar" style="grid-template-columns:30px minmax(0,1fr) 30px"><span class="mono">${w}</span><div class="track"><i style="width:${n/50*100}%;background:var(--learn)"></i></div><span class="mono">${n}</span></div>`).join('')}<div class="axis" style="grid-template-columns:30px minmax(0,1fr) 30px"><span></span><div><span>0</span><span>25</span><span>50</span></div><span></span></div></section>
    <section class="card pad"><h3>Cấp độ ước tính</h3><p class="muted">Gần TOPIK I cấp 2. Cần luyện thêm nghe hội thoại dài.</p></section></div>`;
}

/* ---------- render ---------- */
function render(){
  clearTimers();
  const app=document.getElementById('app');
  if(S.screen==='login'){ app.innerHTML=login(); }
  else if(S.screen==='live'){ app.innerHTML=`<div style="display:grid;grid-template-rows:56px minmax(0,1fr);height:100%">${topbar()}<div style="min-height:0">${liveView()}</div></div>`;
    timers.push(setInterval(tickLive,1000)); timers.push(setInterval(typePartial,140)); const f=document.getElementById('feed'); if(f) f.scrollTop=f.scrollHeight; }
  else if(S.screen==='processing'){ app.innerHTML=`<div style="display:grid;grid-template-rows:56px minmax(0,1fr);height:100%">${topbar()}${processingView()}</div>`;
    timers.push(setTimeout(()=>{S.proc=(S.proc||0)+1; if(S.proc>=4){S.proc=0;S.screen='app';S.role='teacher';S.view='lesson';S.lesson='l7';S.lessonTab='vocab';toast('Buổi học đã lưu. Duyệt từ vựng trước khi gửi cho lớp.');} render();},900)); }
  else {
    let c='';
    if(S.role==='teacher') c={classes:classesView,lessons:lessonsView,library:libraryView,homework:homeworkView,stats:statsView,lesson:lessonView}[S.view]();
    else { c={home:sHome,slive:sLive,words:sWords,review:sReview,progress:sProgress}[S.sview]();
      if(S.sview==='slive'){ if(!S.live) S.live={shown:3,paused:false}; timers.push(setInterval(()=>{ if(S.live.shown<SEGS.length&&!document.querySelector('.pop')){S.live.shown++;renderKeepScroll();} },6000)); bindHold(); } }
    app.innerHTML=shell(c); if(S.sview==='slive'&&S.role==='student') bindHold();
  }
  const layer=document.getElementById('layer');
  layer.innerHTML=S.modal==='wizard'?wizard():S.modal==='stop'?stopDialog():S.modal==='invite'?inviteDialog():S.modal==='poll'?pollDialog():'';
  if(S.modal==='wizard'&&S.wiz.step===3){ timers.push(setInterval(()=>{document.querySelectorAll('#meter i').forEach((b,i)=>b.style.height=(20+Math.random()*80*(1-Math.abs(i-6)/8))+'%')},140)); }
}
function renderKeepScroll(stick){
  const f=document.getElementById('feed')||document.getElementById('main'); const atEnd=f?f.scrollHeight-f.scrollTop-f.clientHeight<80:false; const top=f?f.scrollTop:0;
  const app=document.getElementById('app');
  if(S.screen==='live') app.innerHTML=`<div style="display:grid;grid-template-rows:56px minmax(0,1fr);height:100%">${topbar()}<div style="min-height:0">${liveView()}</div></div>`;
  else { app.innerHTML=shell(sLive()); bindHold(); }
  const g=document.getElementById('feed')||document.getElementById('main'); if(g) g.scrollTop=(stick&&atEnd)||(!f)?g.scrollHeight:top;
}
function bindHold(){
  const h=document.getElementById('hold'); if(!h||h.dataset.b) return; h.dataset.b=1;
  const on=e=>{e.preventDefault();h.classList.add('rec-on');h.innerHTML=ic('mic',20)+' Đang nghe… thả tay để gửi'};
  const off=()=>{ if(!h.classList.contains('rec-on')) return; h.classList.remove('rec-on'); h.innerHTML=ic('mic',20)+' Giữ để hỏi';
    const orig={vi:'Cô ơi, -아서 với -니까 khác nhau thế nào ạ?',zh:'老师，-아서 和 -니까 有什么不同？',en:'What is the difference between -아서 and -니까?'}[S.slang]||'-아서 / -니까 ?';
    S.questions.push({lang:['vi','zh','en'].includes(S.slang)?S.slang:'en',who:'Minh',orig,ko:'선생님, -아서하고 -니까는 어떻게 달라요?',st:'open'});
    toast('Đã gửi câu hỏi. Cô Kim nhận bản tiếng Hàn.'); };
  h.addEventListener('pointerdown',on); h.addEventListener('pointerup',off); h.addEventListener('pointerleave',off);
  h.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on(e)}); h.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')off()});
}

/* ---------- dialogs ---------- */
function stopDialog(){return `<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(420px,100%)"><header><h2>Kết thúc buổi học?</h2></header><div class="body"><p class="muted">Bản ghi ${String(Math.floor(S.live.elapsed/60))} phút sẽ được lưu. AI sẽ tạo từ vựng, ngữ pháp và bài tập để bạn duyệt trước khi gửi cho lớp.</p>${S.questions.some(q=>q.st==='open')?`<div class="callout warn">${ic('help')} Còn ${S.questions.filter(q=>q.st==='open').length} câu hỏi chưa trả lời. Chúng sẽ nằm trong mục Câu hỏi học sinh.</div>`:''}</div><footer><button class="btn ghost" data-a="close">Tiếp tục dạy</button><button class="btn live" data-a="stop">${ic('stop')} Kết thúc và lưu</button></footer></div></div>`}
function inviteDialog(){const c=cls();return `<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(420px,100%)"><header><div class="between"><h2>Mời học sinh vào lớp</h2><button class="iconbtn" data-a="close" aria-label="Đóng">${ic('x')}</button></div></header><div class="body" style="align-items:center;text-align:center">
  <svg width="160" height="160" viewBox="0 0 21 21" aria-label="Mã QR mẫu" style="background:#fff;padding:8px;border-radius:12px">${(()=>{let r='';const s='K2A8X1dasi';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=f?((x%6===0||y%6===0||(x>1&&x<5&&y>1&&y<5))||(x>13&&(x===14||x===20||y===0||y===6||(x>15&&x<19&&y>1&&y<5)))||(y>13&&(y===14||y===20||x===0||x===6||(x>1&&x<5&&y>15&&y<19)))):((x*7+y*13+s.charCodeAt((x+y)%s.length))%3===0);if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;}return r})()}</svg>
  <span class="ccode" style="font-size:22px;padding:6px 14px;letter-spacing:.15em">${c.code}</span><p class="muted">Học sinh quét mã hoặc nhập mã, rồi chọn tiếng mẹ đẻ. Phụ đề ngôn ngữ mới sẽ tự bật.</p>
  <button class="btn" data-a="copy" data-v="${c.code}">${ic('copy')} Sao chép mã</button></div></div></div>`}
function pollDialog(){return `<div class="scrim" data-a="scrim"><div class="modal" role="dialog" aria-modal="true" style="width:min(460px,100%)"><header><div class="between"><h2>Câu hỏi nhanh</h2><button class="iconbtn" data-a="close" aria-label="Đóng">${ic('x')}</button></div></header><div class="body">
  <label class="field">Câu hỏi (tiếng Hàn, học sinh thấy kèm bản dịch)<input class="input ko" id="poll-q" value="‘배가 아___ 병원에 갔어요’ — 빈칸에 알맞은 것은?"></label>
  <div class="stack" style="gap:8px">${[['파서',62],['프니까',23],['파고',15]].map(([o,p],i)=>`<div class="hbar" style="grid-template-columns:60px minmax(0,1fr) 44px"><span class="ko">${String.fromCharCode(65+i)}. ${o}</span><div class="track"><i style="width:${p}%;background:${i===0?'var(--learn)':'var(--faint)'}"></i></div><span class="mono" style="text-align:right">${p}%</span></div>`).join('')}</div>
  <p class="faint" style="font-size:12px">Kết quả mẫu: 13/21 học sinh đã trả lời.</p></div><footer><button class="btn ghost" data-a="close">Đóng</button><button class="btn primary" data-a="pollSend">Gửi cho cả lớp</button></footer></div></div>`}
function wordPop(w,el){
  const d=DICT[w]; if(!d) return; closePop();
  const lang=S.role==='student'?S.slang:'vi';
  const p=document.createElement('div'); p.className='pop'; p.setAttribute('role','dialog');
  p.innerHTML=`<div class="between"><span class="ko" style="font-size:22px;font-weight:700">${w}</span><button class="iconbtn" data-a="closePop" aria-label="Đóng">${ic('x')}</button></div>
    <div class="row"><span class="chip">${d.pos}</span><span class="chip">TOPIK ${d.topik}</span></div>
    <div style="font-size:16px;font-weight:600">${d[lang]||d.en}</div><span class="ko muted">${d.ex}</span>
    <div class="row"><button class="btn sm" data-a="toast" data-v="Phát âm: ${w}">${ic('sound')} Nghe</button><button class="btn sm primary" data-a="saveWord" data-v="${w}">${ic('star')} Lưu vào Sổ từ</button></div>`;
  document.body.appendChild(p);
  const r=el.getBoundingClientRect(), pw=p.offsetWidth, ph=p.offsetHeight;
  let x=Math.min(Math.max(16,r.left),window.innerWidth-pw-16), y=r.bottom+8; if(y+ph>window.innerHeight-16) y=Math.max(16,r.top-ph-8);
  p.style.left=x+'px'; p.style.top=y+'px';
}
const closePop=()=>document.querySelectorAll('.pop').forEach(p=>p.remove());
let tt; function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }

/* ---------- actions ---------- */
const A={
  google(){S.loginStep=2;render()}, loginBack(){S.loginStep=1;render()},
  pickRole(v){S.role=v;S.screen='app';toast(v==='teacher'?'Xin chào cô Kim':'Xin chào Minh');render()},
  role(v){S.role=v; if(S.screen==='login'||S.screen==='processing') S.screen='app'; if(S.screen==='live'&&v==='student'){S.screen='app';S.sview='slive';} if(v==='teacher'&&S.screen==='app'&&!S.view) S.view='classes'; closePop(); render()},
  logout(){S.screen='login';S.loginStep=1;S.live=null;render()},
  theme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'},
  offline(){S.offline=!S.offline;toast(S.offline?'Đang giả lập mất mạng':'Đã có mạng lại. Đang đồng bộ.');render()},
  nav(v){ if(S.role==='teacher') S.view=v; else S.sview=v; S.flip=false; render(); document.getElementById('main')?.scrollTo(0,0)},
  pickClass(v){S.classId=v;render()}, classTab(v){S.classTab=v;render()},
  copy(v){ navigator.clipboard?.writeText(v).then(()=>toast('Đã sao chép mã '+v),()=>toast('Mã lớp: '+v)) ?? toast('Mã lớp: '+v)},
  toast(v){toast(v)}, noop(){},
  tg(_,el){el.classList.toggle('on')}, chipToggle(_,el){const on=el.style.background.includes('primary');el.style.background=on?'':'var(--primary)';el.style.color=on?'':'var(--on-primary)'},
  newSession(){openWizard()}, close(){S.modal=null;render()}, scrim(_,el,e){ if(e.target===el){S.modal=null;render()} },
  wzClass(){},
  wzFormat(v){S.wiz.format=v; S.wiz.source=v==='room'?'mic':v==='online'?'tab':'both'; render()},
  wzSource(v){S.wiz.source=v;render()}, wzDisplay(v){S.wiz.display=v;render()}, wzAdv(){S.wiz.adv=!S.wiz.adv;render()},
  wzPickTab(){S.wiz.tabPicked=true;toast('Đã chọn tab Zoom – Sơ cấp 2');render()},
  wzNext(){ const t=document.getElementById('wz-title'); if(t) S.wiz.title=t.value; const tp=document.getElementById('wz-topic'); if(tp) S.wiz.topic=tp.value; S.wiz.step++; render()},
  wzBack(){S.wiz.step--;render()},
  start(){S.classId=S.wiz.classId; startLive(); toast('Đã bắt đầu ghi. Học sinh đang nhận phụ đề.')},
  filter(v){S.live.filter=v;renderKeepScroll()}, ltab(v){S.live.tab=v; if(v==='questions') S.live.qSeen=S.questions.length; renderKeepScroll()},
  pause(){S.live.paused=!S.live.paused;renderKeepScroll()},
  proj(){S.live.proj=!S.live.proj;renderKeepScroll()},
  invite(){S.modal='invite';render()}, poll(){S.modal='poll';render()}, pollSend(){S.modal=null;toast('Đã gửi câu hỏi nhanh cho 21 học sinh');render()},
  qDone(v){S.questions[v].st='done';renderKeepScroll()}, clearConfused(){S.live.confused=0;renderKeepScroll()},
  assist(v){const o=document.getElementById('assist-out'); const ans={'Từ vựng mới?':'Từ mới tới giờ: 음식, 부산, 병원, 가방, 할인. Từ 할인 xuất hiện 3 lần.','Ngữ pháp vừa dạy?':'-고 싶다 (muốn) và -아/어서 (vì … nên). Li Wei dùng đúng -어서 ở câu cuối.','Tóm tắt tới giờ':'12 phút đầu giới thiệu -고 싶다, sau đó chuyển sang lý do với -아/어서 trong tình huống mua sắm.','Gợi ý câu hỏi kiểm tra':'“배가 아___ 병원에 갔어요” (đáp án: 파서). Hỏi thêm: vì sao không dùng -아서 với câu mệnh lệnh?'}[v]; if(o) o.innerHTML=`<span class="eyebrow">${v}</span><span>${ans}</span>`},
  confirmStop(){S.modal='stop';render()},
  stop(){S.modal=null;S.screen='processing';S.proc=0;render()},
  openLesson(v){S.lesson=v;S.view='lesson';S.lessonTab='transcript';render()}, lessonTab(v){S.lessonTab=v;render()},
  seek(v){S.playIdx=+v;render()},
  approve(){toast('Đã gửi bản ghi, từ vựng và bài tập cho 23 học sinh');const l=LESSONS.find(x=>x.id===S.lesson);if(l)l.st='Đã giao';render()},
  slang(v){S.slang=v;render()},
  flip(){S.flip=!S.flip;render()}, nextCard(){S.flashIdx++;S.flip=false;render()},
  confusedStudent(){toast('Đã báo cô Kim là bạn chưa hiểu câu vừa rồi'); if(S.live) S.live.confused=(S.live.confused||0)+1},
  word(v,el){wordPop(v,el)}, closePop(){closePop()},
  saveWord(v){closePop();toast(`Đã lưu ${v} vào Sổ từ`)}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.pop')&&!e.target.closest('[data-a="word"]')) closePop();
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a; if(a==='scrim'&&e.target!==t) return;
  if(A[a]) A[a](t.dataset.v,t,e);
});
document.addEventListener('change',e=>{ if(e.target.id==='wz-class'){S.wiz.classId=e.target.value;render()} });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(document.querySelector('.pop')) closePop(); else if(S.live&&S.live.proj){S.live.proj=false;renderKeepScroll()} else if(S.modal){S.modal=null;render()} }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.w')){e.preventDefault();wordPop(e.target.dataset.v,e.target)}
});
/* open in a realistic working state: teacher dashboard */
S.screen='app'; render();
</script>
